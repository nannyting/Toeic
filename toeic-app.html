<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>多益背單字</title>
<style>
  :root{
    --bg:#FAF9F5; --paper:#FFFFFF; --ink:#1C1B19; --ink-soft:#6B6862; --line:#E7E4DC;
    --moss:#3F6B4E; --moss-soft:#E4EEE7; --amber:#C97B3D; --amber-soft:#F5E7D8; --danger:#B54B4B;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;}
  #app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px;overflow-x:hidden;}
  .screen{display:none;}
  .screen.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 14px;}
  .brand{font-family:Georgia,"Noto Serif TC",serif;font-size:26px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:6px;}
  .brand small{font-size:14px;color:var(--ink-soft);font-weight:400;font-family:inherit;}
  .modeSwitch{display:flex;gap:18px;font-size:15px;color:var(--ink-soft);}
  .modeSwitch span{cursor:pointer;padding-bottom:3px;}
  .modeSwitch span.active{color:var(--ink);font-weight:700;border-bottom:2px solid var(--moss);}

  .daystrip{display:flex;padding:6px 14px 4px;gap:2px;overflow-x:auto;}
  .daycell{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;cursor:pointer;}
  .daycell .dow{font-size:12px;color:var(--ink-soft);}
  .daycell .num{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid transparent;color:var(--ink-soft);}
  .daycell.today .num{background:var(--ink);color:#fff;}
  .daycell.selected .num{border-color:var(--moss);color:var(--ink);font-weight:700;}

  .dayheading{font-family:Georgia,"Noto Serif TC",serif;font-size:22px;font-weight:700;margin:18px 20px 10px;}
  .sectionCard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin:0 16px 16px;overflow:hidden;}
  .filmstrip{display:flex;gap:0;overflow-x:auto;}
  .filmshot{flex:0 0 auto;width:88px;height:88px;display:flex;align-items:flex-end;justify-content:center;color:#fff;font-family:Georgia,"Noto Serif TC",serif;font-size:12px;font-weight:700;padding-bottom:8px;position:relative;text-align:center;}
  .rowLine{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-top:1px solid var(--line);}
  .rowLine .rtitle{font-size:16px;font-weight:700;}
  .rowLine .rmeta{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .rowLine .rtime{font-size:13px;color:var(--ink-soft);}
  .progressbar{height:4px;background:var(--line);border-radius:2px;margin:2px 18px 0;overflow:hidden;}
  .progressbar > div{height:100%;background:var(--moss);width:0%;}
  .hint{padding:12px 18px;font-size:14px;color:var(--ink-soft);border-top:1px solid var(--line);}
  .goBtn{margin:0 16px 18px;padding:15px;background:var(--ink);color:#fff;text-align:center;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;}
  .goBtn:active{opacity:.85;}
  .banner{margin:0 16px 16px;padding:14px 16px;background:var(--amber-soft);border-radius:14px;font-size:13px;color:#6b4321;line-height:1.6;}

  .cardTop{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;}
  .closeBtn{font-size:22px;color:var(--ink);cursor:pointer;background:none;border:none;}
  .cardProgressTrack{flex:1;height:4px;background:var(--line);border-radius:2px;margin:0 14px;overflow:hidden;}
  .cardProgressTrack > div{height:100%;background:var(--ink);}
  .pillRow{display:flex;gap:8px;}
  .pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:var(--paper);border:1px solid var(--line);font-size:13px;}
  .pill.ok{color:var(--moss);}
  .pill.trash{color:var(--amber);}

  .swipeHint{display:flex;justify-content:space-between;padding:0 30px;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .flashWrap{padding:6px 16px 0;position:relative;}
  .flashcard{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;touch-action:pan-y;position:relative;transition:transform .25s ease, opacity .25s ease;}
  .flashcard.flyLeft{transform:translateX(-140%) rotate(-8deg);opacity:0;}
  .flashcard.flyRight{transform:translateX(140%) rotate(8deg);opacity:0;}
  .swipeBadge{position:absolute;top:16px;z-index:5;padding:6px 14px;border-radius:20px;font-size:14px;font-weight:700;color:#fff;opacity:0;transition:opacity .1s;}
  .swipeBadge.left{left:16px;background:var(--moss);}
  .swipeBadge.right{right:16px;background:var(--amber);}

  .cardTopBar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 4px;}
  .cardTopBar .pos-tag{font-size:12px;background:var(--moss-soft);color:var(--moss);padding:4px 10px;border-radius:8px;font-weight:700;}
  .cardTopBar .bookmark{width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;}
  .wordBody{padding:22px 22px 8px;}
  .wordHead{display:flex;align-items:flex-start;justify-content:space-between;}
  .wordText{font-family:Georgia,"Noto Serif TC",serif;font-size:32px;font-weight:700;background:linear-gradient(transparent 60%, var(--amber-soft) 60%);display:inline;}
  .phonetic{color:var(--ink-soft);font-size:15px;margin-top:6px;}
  .speakBtn{width:42px;height:42px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;}
  .defRow{display:flex;align-items:baseline;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .defRow .pos{width:20px;height:20px;border-radius:50%;background:var(--moss-soft);color:var(--moss);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .defRow .defzh{font-size:19px;font-weight:600;}
  .exampleItem{margin-top:12px;padding:14px;background:var(--bg);border-radius:14px;display:flex;justify-content:space-between;gap:10px;}
  .exampleItem .en{font-size:15px;line-height:1.5;}
  .exampleItem .en b{font-weight:700;}
  .exampleItem .zh{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .miniSpeak{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;}
  .cardFooterMeta{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 20px;font-size:13px;color:var(--ink-soft);}

  .flashActions{display:flex;gap:12px;padding:16px 16px 6px;}
  .flashActions button{flex:1;padding:16px;border-radius:14px;font-size:15px;font-weight:700;border:none;cursor:pointer;}
  .btnKnown{background:var(--moss-soft);border:1px solid var(--moss);color:var(--moss);}
  .btnLearn{background:var(--amber-soft);border:1px solid var(--amber);color:#8a4f1f;}

  .quizTop{display:flex;align-items:center;gap:14px;padding:16px 18px 6px;}
  .quizTop .track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .quizTop .track > div{height:100%;background:var(--ink);}
  .quizPart{padding:18px 20px 4px;font-size:15px;font-weight:700;color:var(--ink-soft);}
  .quizStem{padding:8px 20px 18px;font-size:19px;line-height:1.7;}
  .hintBulb{margin:10px 20px;width:44px;height:44px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
  .optionsSheet{margin-top:20px;background:var(--paper);border-top:1px solid var(--line);border-radius:20px 20px 0 0;}
  .optGrip{width:36px;height:4px;background:var(--line);border-radius:2px;margin:10px auto;}
  .option{display:flex;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--line);cursor:pointer;}
  .option:first-child{border-top:none;}
  .option .oletter{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-soft);flex-shrink:0;}
  .option.selected .oletter{background:var(--ink);border-color:var(--ink);color:#fff;}
  .option.correct .oletter{background:var(--moss);border-color:var(--moss);color:#fff;}
  .option.wrong .oletter{background:var(--danger);border-color:var(--danger);color:#fff;}
  .option .otext{font-size:16px;}
  .explainBox{margin:14px 20px;padding:14px 16px;background:var(--moss-soft);border-radius:12px;font-size:14px;color:#2c4a35;line-height:1.6;}
  .confirmBtn{margin:8px 16px 18px;padding:16px;background:var(--ink);color:#fff;text-align:center;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;}
  .confirmBtn.disabled{opacity:.35;pointer-events:none;}

  .resultWrap{padding:60px 30px;text-align:center;}
  .resultWrap .big{font-family:Georgia,"Noto Serif TC",serif;font-size:56px;font-weight:700;}
  .resultWrap .sub{color:var(--ink-soft);margin-top:8px;font-size:15px;}
  .resultWrap .retry{margin-top:30px;padding:15px 30px;background:var(--ink);color:#fff;border-radius:14px;display:inline-block;cursor:pointer;font-weight:700;}

  .favItem{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-top:1px solid var(--line);cursor:pointer;}
  .favItem:first-child{border-top:none;}
  .favItem .fw{font-weight:700;font-size:16px;}
  .favItem .fz{font-size:13px;color:var(--ink-soft);margin-top:3px;}
  .favRemove{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--danger);cursor:pointer;flex-shrink:0;}
  .emptyState{padding:60px 30px;text-align:center;color:var(--ink-soft);}

  .bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 22px;}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-size:11px;cursor:pointer;}
  .navitem.active{color:var(--ink);font-weight:700;}
  .navitem .ic{font-size:20px;}
</style>
</head>
<body>
<div id="app">

  <div class="screen active" id="screen-home">
    <div class="topbar">
      <div class="brand">TOEIC <small>單字通</small></div>
      <div class="modeSwitch">
        <span id="tab-vocab" class="active" onclick="setMode('vocab')">詞彙</span>
        <span id="tab-quiz" onclick="setMode('quiz')">實戰</span>
      </div>
    </div>
    <div class="daystrip" id="daystrip"></div>
    <div class="dayheading" id="dayheading">Day 1</div>

    <div class="sectionCard" id="vocabCard">
      <div class="filmstrip" id="filmstrip"></div>
      <div class="rowLine" onclick="openFlash()">
        <div><div class="rtitle">快速略讀</div></div>
        <div class="rtime" id="vocabTime"></div>
      </div>
      <div class="progressbar"><div id="vocabProgress"></div></div>
      <div class="hint" id="vocabHint"></div>
      <div class="goBtn" onclick="openFlash()">立即開始</div>
    </div>

    <div class="sectionCard" id="quizCard" style="display:none;">
      <div class="rowLine" style="border-top:none;">
        <div><div class="rtitle">Part 5 · 文法選擇</div><div class="rmeta" id="quizMeta"></div></div>
        <div class="rtime" id="quizTime"></div>
      </div>
      <div class="hint">原創文法練習題，作答後立即看解析。</div>
      <div class="goBtn" onclick="openQuiz()">立即開始</div>
    </div>

    <div class="banner" id="scopeBanner"></div>
  </div>

  <div class="screen" id="screen-flash">
    <div class="cardTop">
      <button class="closeBtn" onclick="closeFlash()">&#10005;</button>
      <div class="cardProgressTrack"><div id="flashProgress"></div></div>
      <div class="pillRow">
        <div class="pill trash">&#9733; <span id="trashCount">0</span></div>
        <div class="pill ok">&#10003; <span id="okCount">0</span>/<span id="okTotal">0</span></div>
      </div>
    </div>
    <div class="swipeHint"><span>&#8592; 左滑：已背完成</span><span>右滑：不熟，存最愛 &#8594;</span></div>
    <div class="flashWrap">
      <div class="swipeBadge left" id="badgeLeft">已背完成</div>
      <div class="swipeBadge right" id="badgeRight">加入最愛</div>
      <div class="flashcard" id="flashcard">
        <div class="cardTopBar">
          <span class="pos-tag" id="artPos"></span>
          <div class="bookmark" onclick="toggleBookmark(event)">&#9733;</div>
        </div>
        <div class="wordBody">
          <div class="wordHead">
            <div>
              <span class="wordText" id="wordText">word</span>
              <div class="phonetic" id="wordPhonetic">[fəˈnɛtɪk]</div>
            </div>
            <div class="speakBtn" onclick="speakWord()">&#128266;</div>
          </div>
          <div class="defRow">
            <div class="pos" id="wordPosBadge">n</div>
            <div class="defzh" id="wordDefZh">定義</div>
          </div>
          <div id="exampleList"></div>
        </div>
        <div class="cardFooterMeta"><span id="cardMetaLeft">Day 1</span><span id="cardMetaRight"></span></div>
      </div>
    </div>
    <div class="flashActions">
      <button class="btnKnown" onclick="animateAndMark(false)">&#8592; 已背完成</button>
      <button class="btnLearn" onclick="animateAndMark(true)">不熟，存最愛 &#8594;</button>
    </div>
  </div>

  <div class="screen" id="screen-quiz">
    <div class="quizTop">
      <button class="closeBtn" onclick="closeQuiz()">&#10005;</button>
      <div class="track"><div id="quizProgress"></div></div>
    </div>
    <div class="quizPart" id="quizPartLabel">Part 5</div>
    <div class="quizStem" id="quizStem"></div>
    <div class="hintBulb" onclick="toggleQuizHint()">&#128161;</div>
    <div id="quizHintBox" class="explainBox" style="display:none;"></div>
    <div class="optionsSheet"><div class="optGrip"></div><div id="optionsList"></div></div>
    <div id="explainSlot"></div>
    <div class="confirmBtn disabled" id="confirmBtn" onclick="confirmAnswer()">確認答案</div>
  </div>

  <div class="screen" id="screen-result">
    <div class="resultWrap">
      <div class="sub">測驗完成</div>
      <div class="big" id="resultScore">0/0</div>
      <div class="sub" id="resultDetail"></div>
      <div class="retry" onclick="backToHome()">回首頁</div>
    </div>
  </div>

  <div class="screen" id="screen-favorites">
    <div class="topbar"><div class="brand">我的最愛</div></div>
    <div class="sectionCard" id="favListWrap"><div id="favList"></div></div>
  </div>

  <div class="bottomnav">
    <div class="navitem active" id="nav-home" onclick="showScreen('screen-home');setActiveNav('nav-home')"><span class="ic">&#8962;</span>首頁</div>
    <div class="navitem" id="nav-fav" onclick="openFavorites()"><span class="ic">&#9733;</span>最愛</div>
    <div class="navitem"><span class="ic">&#128202;</span>分析</div>
    <div class="navitem"><span class="ic">&#128179;</span>會員</div>
  </div>
</div>

<script>
/* ===================== DATA ===================== */
const palette = ["#3F6B4E","#4A6FA5","#B5622E","#7A5C9E","#2C7A7B","#A5473F","#5B6B3F","#7B5B45"];
const glyphs  = ["&#128663;","&#128203;","&#128200;","&#127939;","&#128188;","&#9992;","&#128179;","&#127974;","&#128231;","&#9878;","&#128230;","&#128241;"];

function E(w,p,pos,zh,ex){ return {w,p,pos,zh,ex}; }

const days = [
{day:1, title:"辦公室與行政 Office & Admin", words:[
E("permit","[pərˈmɪt]","n","許可證",[
 {en:"I need a <b>permit</b> to park my car here.",zh:"我需要一張許可證才能把車停在這裡。"},
 {en:"The city will not issue a building <b>permit</b> without an inspection.",zh:"沒有經過檢查，市府不會核發建築許可證。"},
 {en:"Her work <b>permit</b> expires at the end of the year.",zh:"她的工作許可證將於年底到期。"}]),
E("itinerary","[aɪˈtɪnəˌrɛri]","n","行程表",[
 {en:"Please review the <b>itinerary</b> before the trip begins.",zh:"出發前請先確認行程表。"},
 {en:"The travel agent emailed us a detailed <b>itinerary</b>.",zh:"旅行社寄來了一份詳細的行程表。"},
 {en:"Our <b>itinerary</b> includes a stop in Osaka.",zh:"我們的行程表包含在大阪停留一站。"}]),
E("reimburse","[ˌriɪmˈbɜrs]","v","償還；報銷",[
 {en:"The company will <b>reimburse</b> your travel expenses.",zh:"公司將會報銷你的差旅費用。"},
 {en:"Employees are <b>reimbursed</b> within two weeks of submitting receipts.",zh:"員工在提交收據後兩週內可獲得報銷。"},
 {en:"We cannot <b>reimburse</b> costs without an official invoice.",zh:"沒有正式發票，我們無法報銷費用。"}]),
E("invoice","[ˈɪnvɔɪs]","n","發票；請款單",[
 {en:"Please send the <b>invoice</b> by the end of the week.",zh:"請於本週結束前寄出請款單。"},
 {en:"The <b>invoice</b> number should appear on every payment.",zh:"每筆付款上都應標明發票號碼。"},
 {en:"We found an error on last month's <b>invoice</b>.",zh:"我們在上個月的請款單上發現了一個錯誤。"}]),
E("vacant","[ˈveɪkənt]","adj","空缺的",[
 {en:"The manager position has been <b>vacant</b> since March.",zh:"經理一職自三月起一直空缺。"},
 {en:"There are three <b>vacant</b> desks on the fourth floor.",zh:"四樓有三張空位的辦公桌。"},
 {en:"The apartment remained <b>vacant</b> for nearly a year.",zh:"這間公寓幾乎閒置了一年。"}]),
E("draft","[dræft]","n","草稿",[
 {en:"Please review the <b>draft</b> before it is printed.",zh:"付印前請先確認草稿。"},
 {en:"I attached the first <b>draft</b> of the proposal.",zh:"我附上了提案的初稿。"},
 {en:"She revised the <b>draft</b> twice before submitting it.",zh:"她在提交前修改了兩次草稿。"}]),
E("stationery","[ˈsteɪʃəˌnɛri]","n","文具",[
 {en:"The office ordered new <b>stationery</b> for the front desk.",zh:"辦公室為櫃檯訂購了新文具。"},
 {en:"Please restock the <b>stationery</b> cabinet by Friday.",zh:"請在週五前補齊文具櫃的存貨。"},
 {en:"All company <b>stationery</b> uses the same logo.",zh:"公司所有的文具都使用同一個標誌。"}]),
E("filing","[ˈfaɪlɪŋ]","n","歸檔",[
 {en:"The <b>filing</b> system was reorganized last month.",zh:"歸檔系統於上個月重新整理。"},
 {en:"Digital <b>filing</b> has replaced most paper records.",zh:"數位歸檔已取代了大部分的紙本紀錄。"},
 {en:"She spent the afternoon <b>filing</b> old contracts.",zh:"她花了整個下午在歸檔舊合約。"}]),
E("correspondence","[ˌkɔrəˈspɑndəns]","n","書信往來",[
 {en:"All <b>correspondence</b> should go through the main office.",zh:"所有書信往來都應透過總辦公室處理。"},
 {en:"He keeps a record of every client <b>correspondence</b>.",zh:"他保留了每一封與客戶往來的書信紀錄。"},
 {en:"Please forward that <b>correspondence</b> to the legal team.",zh:"請將那封信轉交給法務團隊。"}]),
E("agenda","[əˈdʒɛndə]","n","議程",[
 {en:"The meeting <b>agenda</b> was sent out yesterday.",zh:"會議議程已於昨天發出。"},
 {en:"Budget planning is first on today's <b>agenda</b>.",zh:"預算規劃是今天議程的第一項。"},
 {en:"We ran out of time to cover the full <b>agenda</b>.",zh:"我們沒有足夠時間討論完整份議程。"}])
]},
{day:2, title:"會議與溝通 Meetings & Communication", words:[
E("negotiate","[nɪˈɡoʊʃiˌeɪt]","v","協商",[
 {en:"Both sides agreed to <b>negotiate</b> a new contract.",zh:"雙方同意協商一份新合約。"},
 {en:"She is skilled at <b>negotiating</b> better prices with suppliers.",zh:"她很擅長與供應商協商更好的價格。"},
 {en:"They will <b>negotiate</b> the terms again next week.",zh:"他們下週將再次協商條款。"}]),

let favorites = JSON.parse(localStorage.getItem('toeic_favorites') || '[]');

function currentDay(){ return days[selectedDayIdx]; }
function saveFavorites(){ localStorage.setItem('toeic_favorites', JSON.stringify(favorites)); }
function saveBookmarks(){ localStorage.setItem('toeic_bookmarks', JSON.stringify(bookmarks)); }

/* ===================== INIT ===================== */
function buildDayStrip(){
  const strip = document.getElementById('daystrip');
  strip.innerHTML = '';
  const dow = ['日','一','二','三','四','五','六'];
  days.forEach((d,i)=>{
    const cell = document.createElement('div');
    cell.className = 'daycell' + (i===selectedDayIdx?' selected':'') + (i===2?' today':'');
    cell.innerHTML = `<div class="dow">${dow[i%7]}</div><div class="num">${d.day}</div>`;
    cell.onclick = ()=>{ selectedDayIdx=i; refreshHome(); };
    strip.appendChild(cell);
  });
}

function refreshHome(){
  buildDayStrip();
  document.getElementById('dayheading').textContent = 'Day ' + currentDay().day + ' · ' + currentDay().title;
  const words = currentDay().words;
  const fs = document.getElementById('filmstrip');
  fs.innerHTML = '';
  words.slice(0,8).forEach((wd,i)=>{
    const shot = document.createElement('div');
    shot.className = 'filmshot';
    shot.style.background = palette[i%palette.length];
    shot.textContent = i===0? wd.w : '';
    fs.appendChild(shot);
  });
  document.getElementById('vocabTime').textContent = '約 ' + words.length + ' 分';
  document.getElementById('vocabHint').textContent = `本日共 ${words.length} 個單字，每字附 3 句例句。`;
  document.getElementById('vocabProgress').style.width = '0%';
  document.getElementById('quizMeta').textContent = quizBank.length + ' 題 · Part 5 / 6 綜合練習';
  document.getElementById('quizTime').textContent = '尚未開始';
  document.getElementById('scopeBanner').innerHTML =
    '目前收錄 ' + (days.length*10) + ' 個多益核心單字（每字 3 句例句）與 ' + quizBank.length + ' 題原創文法練習題，涵蓋 ' + days.length + ' 大情境主題。可依此格式持續擴充至完整字庫。';
}

function setMode(m){
  mode = m;
  document.getElementById('tab-vocab').classList.toggle('active', m==='vocab');
  document.getElementById('tab-quiz').classList.toggle('active', m==='quiz');
  document.getElementById('vocabCard').style.display = m==='vocab' ? '' : 'none';
  document.getElementById('quizCard').style.display = m==='quiz' ? '' : 'none';
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function setActiveNav(id){
  document.querySelectorAll('.navitem').forEach(n=>n.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ===================== FLASHCARDS ===================== */
function openFlash(){
  flashIdx = 0; okCount = 0; trashCount = 0;
  document.getElementById('okTotal').textContent = currentDay().words.length;
  renderFlash();
  showScreen('screen-flash');
}
function closeFlash(){ showScreen('screen-home'); refreshHome(); }

function renderFlash(){
  const words = currentDay().words;
  const wd = words[flashIdx];
  const card = document.getElementById('flashcard');
  card.classList.remove('flyLeft','flyRight');
  card.style.transform = ''; card.style.opacity='';
  document.getElementById('artPos').textContent = wd.pos + '. 詞性';
  document.getElementById('wordText').textContent = wd.w;
  document.getElementById('wordPhonetic').textContent = wd.p;
  document.getElementById('wordPosBadge').textContent = wd.pos;
  document.getElementById('wordDefZh').textContent = wd.zh;

  const list = document.getElementById('exampleList');
  list.innerHTML = '';
  wd.ex.forEach((ex,i)=>{
    const item = document.createElement('div');
    item.className = 'exampleItem';
    item.innerHTML = `<div><div class="en">${ex.en}</div><div class="zh">${ex.zh}</div></div><div class="miniSpeak" onclick="speakText('${ex.en.replace(/<[^>]+>/g,'').replace(/'/g,"\\'")}')">&#128266;</div>`;
    list.appendChild(item);
  });

  document.getElementById('cardMetaLeft').textContent = 'Day ' + currentDay().day + ' · ' + (flashIdx+1) + '/' + words.length;
  document.getElementById('cardMetaRight').textContent = '例句 x' + wd.ex.length;
  document.getElementById('okCount').textContent = okCount;
  document.getElementById('trashCount').textContent = trashCount;
  document.getElementById('flashProgress').style.width = (flashIdx/words.length*100) + '%';

  const key = selectedDayIdx+'-'+wd.w;
  document.querySelector('.cardTopBar .bookmark').style.color = favorites.find(f=>f.key===key) ? '#C97B3D' : 'var(--ink)';
}

function speakText(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  window.speechSynthesis.speak(u);
}
function speakWord(){ speakText(currentDay().words[flashIdx].w); }

function toggleBookmark(e){
  e.stopPropagation();
  const wd = currentDay().words[flashIdx];
  const key = selectedDayIdx+'-'+wd.w;
  const idx = favorites.findIndex(f=>f.key===key);
  if(idx>=0){ favorites.splice(idx,1); }
  else { favorites.push({key, w:wd.w, p:wd.p, pos:wd.pos, zh:wd.zh, ex:wd.ex, day:currentDay().day}); }
  saveFavorites();
  document.querySelector('.cardTopBar .bookmark').style.color = idx>=0 ? 'var(--ink)' : '#C97B3D';
}

function addToFavorites(wd){
  const key = selectedDayIdx+'-'+wd.w;
  if(!favorites.find(f=>f.key===key)){
    favorites.push({key, w:wd.w, p:wd.p, pos:wd.pos, zh:wd.zh, ex:wd.ex, day:currentDay().day});
    saveFavorites();
  }
}

function markCard(needsLearning){
  const wd = currentDay().words[flashIdx];
  if(needsLearning){ trashCount++; addToFavorites(wd); } else { okCount++; }
  const words = currentDay().words;
  if(flashIdx < words.length-1){
    flashIdx++;
    renderFlash();
  } else {
    document.getElementById('flashProgress').style.width = '100%';
    setTimeout(closeFlash, 200);
  }
}

function animateAndMark(needsLearning){
  const card = document.getElementById('flashcard');
  card.classList.add(needsLearning ? 'flyRight' : 'flyLeft');
  setTimeout(()=> markCard(needsLearning), 220);
}

/* swipe gestures */
(function initSwipe(){
  const card = document.getElementById('flashcard');
  let startX=0, startY=0, dx=0, dragging=false;
  function badgeUpdate(dx){
    document.getElementById('badgeLeft').style.opacity = dx < -30 ? Math.min(1,(-dx-30)/60) : 0;
    document.getElementById('badgeRight').style.opacity = dx > 30 ? Math.min(1,(dx-30)/60) : 0;
  }
  card.addEventListener('touchstart', e=>{
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; dragging=true;
  }, {passive:true});
  card.addEventListener('touchmove', e=>{
    if(!dragging) return;
    dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if(Math.abs(dx) > Math.abs(dy)){
      card.style.transform = `translateX(${dx}px) rotate(${dx/20}deg)`;
      badgeUpdate(dx);
    }
  }, {passive:true});
  card.addEventListener('touchend', ()=>{
    dragging=false;
    if(dx < -90){ animateAndMark(false); }
    else if(dx > 90){ animateAndMark(true); }
    else { card.style.transform=''; badgeUpdate(0); }
    dx = 0;
  });
})();

/* ===================== QUIZ ===================== */
function openQuiz(){
  quizIdx = 0; quizScore = 0;
  renderQuiz();
  showScreen('screen-quiz');
}
function closeQuiz(){ showScreen('screen-home'); refreshHome(); }

function renderQuiz(){
  quizSelected = null; quizAnswered = false;
  const q = quizBank[quizIdx];
  document.getElementById('quizProgress').style.width = (quizIdx/quizBank.length*100) + '%';
  document.getElementById('quizPartLabel').textContent = q.part + ' (' + (quizIdx+1) + '/' + quizBank.length + ')';
  document.getElementById('quizStem').innerHTML = q.stem;
  document.getElementById('quizHintBox').style.display = 'none';
  document.getElementById('quizHintBox').textContent = '提示：先判斷空格的詞性或子句關係，再依語意縮小選項範圍。';
  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt,i)=>{
    const row = document.createElement('div');
    row.className = 'option';
    row.innerHTML = `<div class="oletter">${letters[i]}</div><div class="otext">${opt}</div>`;
    row.onclick = ()=> selectOption(i);
    list.appendChild(row);
  });
  document.getElementById('explainSlot').innerHTML = '';
  document.getElementById('confirmBtn').textContent = '確認答案';
  document.getElementById('confirmBtn').classList.add('disabled');
}

function selectOption(i){
  if(quizAnswered) return;
  quizSelected = i;
  document.querySelectorAll('.option').forEach((el,idx)=>{ el.classList.toggle('selected', idx===i); });
  document.getElementById('confirmBtn').classList.remove('disabled');
}
function toggleQuizHint(){
  const box = document.getElementById('quizHintBox');
  box.style.display = box.style.display==='none' ? 'block' : 'none';
}
function confirmAnswer(){
  if(quizSelected===null) return;
  if(!quizAnswered){
    quizAnswered = true;
    const q = quizBank[quizIdx];
    const opts = document.querySelectorAll('.option');
    opts.forEach((el,idx)=>{
      if(idx===q.answer) el.classList.add('correct');
      else if(idx===quizSelected) el.classList.add('wrong');
    });
    if(quizSelected===q.answer) quizScore++;
    const box = document.createElement('div');
    box.className = 'explainBox';
    box.textContent = q.expl;
    document.getElementById('explainSlot').appendChild(box);
    document.getElementById('confirmBtn').textContent = quizIdx < quizBank.length-1 ? '下一題' : '完成測驗';
  } else {
    if(quizIdx < quizBank.length-1){ quizIdx++; renderQuiz(); }
    else { finishQuiz(); }
  }
}
function finishQuiz(){
  document.getElementById('resultScore').textContent = quizScore + '/' + quizBank.length;
  const pct = Math.round(quizScore/quizBank.length*100);
  document.getElementById('resultDetail').textContent = '答對率 ' + pct + '%，繼續保持！';
  showScreen('screen-result');
}
function backToHome(){ showScreen('screen-home'); refreshHome(); setActiveNav('nav-home'); }

/* ===================== FAVORITES ===================== */
function openFavorites(){
  renderFavorites();
  showScreen('screen-favorites');
  setActiveNav('nav-fav');
}
function renderFavorites(){
  const wrap = document.getElementById('favList');
  if(favorites.length===0){
    wrap.innerHTML = '<div class="emptyState">還沒有收藏的單字。<br>在字卡畫面往右滑，或點選星號即可加入最愛。</div>';
    return;
  }
  wrap.innerHTML = '';
  favorites.forEach((f,i)=>{
    const row = document.createElement('div');
    row.className = 'favItem';
    row.innerHTML = `<div><div class="fw">${f.w} <span style="color:var(--ink-soft);font-weight:400;font-size:13px;">Day ${f.day}</span></div><div class="fz">${f.zh}</div></div><div class="favRemove" onclick="removeFavorite(event,${i})">&#10005;</div>`;
    row.onclick = ()=> speakText(f.w);
    wrap.appendChild(row);
  });
}
function removeFavorite(e,i){
  e.stopPropagation();
  favorites.splice(i,1);
  saveFavorites();
  renderFavorites();
}

/* ===================== BOOT ===================== */
refreshHome();
</script>
